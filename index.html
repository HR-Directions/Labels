
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طباعة ملصقات الصيدلية - مقاس 3×1 سم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        
        /* * إعدادات الطباعة المخصصة للملصقات 30 مم (3 سم) × 10 مم (1 سم) 
         */
        @media print {
            /* إخفاء كل شيء في الصفحة الأساسية */
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
            }
            body > *:not(#print-area) {
                display: none !important;
            }
            
            /* إظهار منطقة الطباعة فقط */
            #print-area {
                display: block !important;
                width: 30mm;
                position: absolute;
                left: 0;
                top: 0;
            }

            .label-page {
                width: 30mm;
                height: 10mm;
                padding: 0.5mm !important; /* هامش بسيط جداً */
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                page-break-after: always;
                page-break-inside: avoid;
                overflow: hidden;
                box-sizing: border-box;
                background-color: white;
                margin: 0 !important;
                border: none !important;
            }

            /* إخفاء الشعار في الطباعة لأن 1 سم مساحة صغيرة جداً ولن تكفي */
            .print-logo {
                display: none !important; 
            }

            .print-text {
                font-size: 5.5pt; /* خط صغير جداً ليناسب 1 سم */
                font-weight: 900; /* خط عريض ليكون مقروءاً */
                text-align: center;
                line-height: 1.1;
                margin-bottom: 0.5mm;
                width: 100%;
                direction: rtl;
                /* السماح بكسر السطر إذا كان النص طويلاً */
                white-space: normal; 
                word-wrap: break-word;
            }

            .barcode-img {
                width: 28mm !important; /* عرض الباركود */
                height: 4mm !important; /* ارتفاع الباركود */
                max-height: 4mm !important;
            }

            /* إجبار الطابعة على هذا المقاس */
            @page {
                size: 30mm 10mm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <div class="max-w-5xl mx-auto px-4 pt-8">
        <!-- Header -->
        <header class="bg-emerald-600 text-white rounded-2xl p-6 shadow-md mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-white/20 p-3 rounded-xl text-3xl">💊</div>
                <div>
                    <h1 class="text-2xl font-bold">نظام طباعة ملصقات الصيدلية</h1>
                    <p class="text-emerald-100 text-sm">متوافق مع طابعات الباركود - مقاس 3 سم × 1 سم</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-white text-emerald-700 px-6 py-2 rounded-lg font-bold shadow-sm hover:bg-emerald-50 transition flex items-center gap-2">
                    <span>🖨️</span> طباعة كل القائمة
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- العمود الأول: إدخال البيانات -->
            <div class="lg:col-span-5 space-y-6">
                <!-- إعدادات الشعار (يظهر في الواجهة فقط وليس في الطباعة لصغر الحجم) -->
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hidden">
                    <!-- تم إخفاء قسم الشعار برمجياً لأننا ألغيناه في الطباعة للحفاظ على المساحة -->
                    <input type="text" id="logo-input" value="" class="hidden">
                </div>

                <!-- نموذج إضافة الجرعة -->
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2">➕ إضافة جرعة جديدة</h2>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الكمية</label>
                                <select id="input-qty" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50">
                                    <script>for(let i=1; i<=10; i++) document.write(`<option value="${i}">${i}</option>`)</script>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الفئة</label>
                                <select id="input-type" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50" onchange="toggleRouteField()">
                                    <option value="قرص">قرص</option>
                                    <option value="كيس">كيس</option>
                                    <option value="كبسولة">كبسولة</option>
                                    <option value="معلقة">معلقة</option>
                                    <option value="لبوسة">لبوسة</option>
                                    <option value="حقنة">حقنة</option>
                                    <option value="نقطة">نقطة</option>
                                    <option value="بخة">بخة</option>
                                </select>
                            </div>
                        </div>

                        <div id="route-container" class="hidden">
                            <label class="block text-xs font-bold text-gray-500 mb-1">التفاصيل (الموضع)</label>
                            <select id="input-route" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50"></select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">التكرار (كل كم ساعة؟)</label>
                            <select id="input-frequency" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50">
                                <script>
                                    for(let i=1; i<=24; i++) {
                                        let label = i === 24 ? "مرة يومياً" : `كل ${i} ساعة`;
                                        document.write(`<option value="${i}">${label}</option>`);
                                    }
                                </script>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">المدة (رقم)</label>
                                <input type="number" id="input-duration-val" placeholder="مثال: 5" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50 text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الوحدة</label>
                                <select id="input-duration-unit" class="w-full border border-gray-200 rounded-lg p-2 bg-gray-50">
                                    <option value="أيام">أيام</option>
                                    <option value="أسابيع">أسابيع</option>
                                    <option value="شهر">شهر</option>
                                </select>
                            </div>
                        </div>

                        <button onclick="addDosage()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition shadow-md">
                            إضافة للقائمة
                        </button>
                    </div>
                </div>
            </div>

            <!-- العمود الثاني: قائمة الملصقات -->
            <div class="lg:col-span-7">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 min-h-[400px] flex flex-col">
                    <div class="p-4 border-b bg-gray-50/50 flex justify-between items-center">
                        <h2 class="font-bold text-gray-700">قائمة الملصقات الجاهزة</h2>
                        <span id="label-count" class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full">0 ملصق</span>
                    </div>
                    
                    <div id="labels-list" class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- العناصر ستظهر هنا -->
                    </div>

                    <div id="empty-state" class="flex-grow flex flex-col items-center justify-center text-gray-400 p-10">
                        <span class="text-5xl mb-2">📋</span>
                        <p>القائمة فارغة، قم بإضافة الجرعات</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- منطقة الطباعة المخفية -->
    <div id="print-area" class="hidden"></div>

    <script>
        let dosages = [];
        const routesMap = {
            'لبوسة': ['شرجي', 'مهبلي'],
            'نقطة': ['بالعين', 'بالأذن', 'بالفم'],
            'بخة': ['بالفم', 'بالأنف', 'موضعي']
        };

        // تفعيل أو إخفاء حقل الموضع بناءً على الفئة
        function toggleRouteField() {
            const type = document.getElementById('input-type').value;
            const container = document.getElementById('route-container');
            const select = document.getElementById('input-route');
            
            if (routesMap[type]) {
                container.classList.remove('hidden');
                select.innerHTML = routesMap[type].map(r => `<option value="${r}">${r}</option>`).join('');
            } else {
                container.classList.add('hidden');
                select.innerHTML = '';
            }
        }

        // إضافة جرعة جديدة للقائمة
        function addDosage() {
            const qty = document.getElementById('input-qty').value;
            const type = document.getElementById('input-type').value;
            const route = document.getElementById('input-route').value;
            const freq = document.getElementById('input-frequency').value;
            const durVal = document.getElementById('input-duration-val').value;
            const durUnit = document.getElementById('input-duration-unit').value;

            if (!durVal) {
                alert("يرجى إدخال مدة العلاج");
                return;
            }

            const id = Date.now();
            // تنسيق النص ليكون مختصراً قدر الإمكان لمقاس 3x1 سم
            let freqText = freq === "24" ? "مرة يومياً" : `كل${freq}س`;
            const dosageText = `${qty}${type} ${route ? route : ''} ${freqText} لـ${durVal}${durUnit}`.trim();
            
            // توليد رقم باركود عشوائي قصير
            const barcode = "R" + Math.floor(10000 + Math.random() * 90000);

            dosages.push({ id, text: dosageText, barcode });
            renderLabels();
            
            document.getElementById('input-duration-val').value = '';
        }

        // حذف ملصق
        function removeDosage(id) {
            dosages = dosages.filter(d => d.id !== id);
            renderLabels();
        }

        // طباعة ملصق واحد فقط
        function printSingleLabel(id) {
            // إخفاء كل الملصقات في منطقة الطباعة
            const allLabels = document.querySelectorAll('.label-page');
            allLabels.forEach(label => label.style.display = 'none');
            
            // إظهار الملصق المطلوب فقط
            const targetLabel = document.getElementById(`print-label-${id}`);
            if (targetLabel) {
                targetLabel.style.display = 'flex';
                window.print();
            }
            
            // إعادة إظهار كل الملصقات بعد الطباعة لتكون جاهزة لزر "طباعة الكل"
            allLabels.forEach(label => label.style.display = 'flex');
        }

        // رسم الواجهة ومنطقة الطباعة
        function renderLabels() {
            const list = document.getElementById('labels-list');
            const printArea = document.getElementById('print-area');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('label-count');

            list.innerHTML = '';
            printArea.innerHTML = '';
            countBadge.innerText = `${dosages.length} ملصق`;

            if (dosages.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                dosages.forEach(item => {
                    // 1. إنشاء البطاقة في واجهة المستخدم
                    const card = document.createElement('div');
                    card.className = "bg-white border border-gray-200 rounded-xl p-3 shadow-sm relative group flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <button onclick="removeDosage(${item.id})" class="absolute top-2 left-2 text-red-400 opacity-0 group-hover:opacity-100 transition bg-red-50 rounded-full w-6 h-6 flex items-center justify-center" title="حذف">✕</button>
                            <div class="text-[10px] text-gray-400 mb-1">الباركود: ${item.barcode}</div>
                            <div class="text-sm font-bold text-gray-700 mb-3">${item.text}</div>
                        </div>
                        <button onclick="printSingleLabel(${item.id})" class="w-full mt-2 bg-gray-100 text-gray-700 text-xs font-bold py-2 rounded hover:bg-emerald-100 hover:text-emerald-700 transition flex items-center justify-center gap-1">
                            <span>🖨️</span> طباعة هذا فقط
                        </button>
                    `;
                    list.appendChild(card);

                    // 2. إنشاء الملصق في منطقة الطباعة المخفية
                    const printLabel = document.createElement('div');
                    printLabel.className = "label-page";
                    printLabel.id = `print-label-${item.id}`;
                    
                    printLabel.innerHTML = `
                        <div class="print-text">${item.text}</div>
                        <svg id="barcode-print-${item.id}" class="barcode-img"></svg>
                    `;
                    printArea.appendChild(printLabel);

                    // توليد الباركود الفعلي باستخدام مكتبة JsBarcode
                    // تم تقليل العرض والارتفاع ليتناسب مع 30mm x 10mm
                    setTimeout(() => {
                        JsBarcode(`#barcode-print-${item.id}`, item.barcode, {
                            format: "CODE128",
                            width: 1,       /* خطوط الباركود رفيعة جداً */
                            height: 15,     /* ارتفاع الباركود قصير */
                            displayValue: false, /* إخفاء الأرقام تحت الباركود لتوفير المساحة */
                            margin: 0
                        });
                    }, 10);
                });
            }
        }
    </script>
</body>
</html>
