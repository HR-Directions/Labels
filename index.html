
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طباعة ملصقات الصيدلية - النهائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        
        /* إعدادات الطباعة للستيكر المزدوج (30mm x 10mm) */
        @media print {
            @page {
                size: 30mm 10mm;
                margin: 0;
            }
            
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
            }
            
            body > *:not(#print-area) {
                display: none !important;
            }
            
            #print-area {
                display: block !important;
                width: 30mm;
                margin: 0;
                padding: 0;
            }

            /* الصفحة الواحدة (30x10) */
            .label-page {
                width: 30mm;
                height: 10mm;
                display: flex;
                flex-direction: column;
                justify-content: center; /* توسيط الستيكرين في الصفحة لتفادي الحواف */
                align-items: center;
                page-break-after: always;
                page-break-inside: avoid;
                overflow: hidden;
                box-sizing: border-box;
                background-color: white;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
            }

            /* الستيكر الواحد (الجرعة الواحدة) - جعلناه 4.7 مم لترك مسافة أمان للقص */
            .single-sticker {
                width: 30mm;
                height: 4.7mm; 
                margin: 0.15mm 0; /* هامش أمان علوي وسفلي لتفادي خط القص في المنتصف */
                display: flex;
                flex-direction: row;
                box-sizing: border-box;
                overflow: hidden;
                padding: 0;
            }

            /* قسم اللوجو والفرع (اليمين) */
            .logo-section {
                width: 9mm; /* تم تكبيرها قليلاً لراحة اللوجو */
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-left: 0.5pt solid #000; /* خط فاصل نحيف وواضح للطابعة */
                box-sizing: border-box;
                padding: 0 0.5mm; 
            }

            /* تحسين اللوجو للطابعات الحرارية */
            .print-logo-img {
                max-width: 100%;
                max-height: 2.8mm; /* تحديد ارتفاع أقصى لمنع دفع النصوص */
                object-fit: contain;
                display: block;
                /* الفلتر التالي يضمن طباعة اللوجو بأفضل سواد ممكن على ورق حراري */
                filter: grayscale(100%) contrast(1.5) brightness(0.9);
            }

            .branch-text {
                font-size: 3.5pt;
                font-weight: 900;
                color: #000;
                line-height: 1;
                text-align: center;
                white-space: nowrap;
                margin-top: 0.5px;
            }

            /* قسم نص الجرعة (اليسار) */
            .dosage-section {
                width: 21mm;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center; /* توسيط عمودي مثالي */
                box-sizing: border-box;
                padding-right: 0.5mm; /* إبعاد الكلام عن الخط الفاصل */
            }

            /* نصوص الجرعة */
            .dose-line {
                font-size: 6.5pt; /* حجم محسوب بدقة للـ 4.7 مم */
                font-weight: 900;
                color: #000;
                line-height: 1.15;
                text-align: center;
                white-space: nowrap;
                letter-spacing: -0.2px; /* تقريب الحروف قليلاً لكسب مساحة */
            }
        }
        
        .modal-hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen pb-10 relative">

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl transform transition-all duration-300 translate-y-20 opacity-0 z-50 flex items-center gap-3">
        <span id="toast-icon" class="text-xl">✅</span>
        <span id="toast-msg" class="font-bold text-sm">تم الحفظ</span>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm modal-hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg transform transition-all flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-emerald-50 rounded-t-2xl">
                <h3 class="text-xl font-bold text-emerald-900 flex items-center gap-2">🏢 إدارة الفروع</h3>
                <button onclick="closeSettings()" class="text-emerald-700 hover:text-red-500 transition text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-grow space-y-6">
                <div>
                    <h4 class="font-bold text-gray-700 mb-3 text-sm">الفروع المسجلة (اختر الفرع النشط)</h4>
                    <div id="branches-list" class="space-y-2">
                        <div class="text-center text-gray-400 text-sm py-4">جاري التحميل...</div>
                    </div>
                </div>

                <hr class="border-gray-200">

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <h4 class="font-bold text-emerald-700 mb-3 text-sm flex items-center gap-1"><span>➕</span> إضافة فرع جديد</h4>
                    <div class="space-y-3">
                        <input type="text" id="new-branch-name" placeholder="اسم الفرع (مثال: الشفاء)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        <input type="text" id="new-branch-logo" placeholder="رابط اللوجو (اختياري)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm text-left focus:ring-2 focus:ring-emerald-500 outline-none" dir="ltr">
                        <button onclick="addNewBranch()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition shadow text-sm">
                            حفظ وإضافة
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="max-w-5xl mx-auto px-4 pt-8">
        <header class="bg-gradient-to-r from-teal-700 to-emerald-600 text-white rounded-2xl p-6 shadow-lg mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div id="header-logo-container" class="bg-white p-2 rounded-xl h-14 w-14 flex items-center justify-center overflow-hidden">
                    <span class="text-2xl">💊</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        نظام طباعة الملصقات 
                        <span id="active-branch-badge" class="bg-white/20 text-xs px-2 py-1 rounded text-emerald-50">بدون فرع</span>
                    </h1>
                    <div class="flex items-center gap-2 text-emerald-100 text-sm mt-1">
                        <span>مقاس البكرة 3x1 (يتم دمج جرعتين)</span>
                        <span class="w-1.5 h-1.5 bg-emerald-300 rounded-full"></span>
                        <span id="cloud-status">جاري الاتصال... ⏳</span>
                    </div>
                </div>
            </div>
            <div class="flex gap-3 flex-wrap">
                <button onclick="openSettings()" class="bg-white/10 backdrop-blur text-white px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-white/20 transition flex items-center gap-2 border border-white/20">
                    ⚙️ الإعدادات
                </button>
                <button onclick="window.print()" class="bg-white text-emerald-700 px-6 py-2 rounded-lg font-black shadow-sm hover:bg-emerald-50 transition flex items-center gap-2 border-2 border-white">
                    <span>🖨️</span> طباعة القائمة
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- الإدخال -->
            <div class="lg:col-span-4">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-8">
                    <h2 class="font-bold text-gray-800 mb-5 flex items-center gap-2 text-lg">➕ تفاصيل الجرعة</h2>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الكمية</label>
                                <select id="input-qty" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-50 font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <script>for(let i=1; i<=10; i++) document.write(`<option value="${i}">${i}</option>`)</script>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الشكل الدوائي</label>
                                <select id="input-type" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-50 font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <option value="قرص">قرص</option>
                                    <option value="كيس">كيس</option>
                                    <option value="كبسولة">كبسولة</option>
                                    <option value="معلقة">معلقة</option>
                                    <option value="لبوسة">لبوسة</option>
                                    <option value="حقنة">حقنة</option>
                                    <option value="نقطة">نقطة</option>
                                    <option value="بخة">بخة</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">التكرار</label>
                            <select id="input-freq" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-50 font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="مرة واحدة">مرة واحدة</option>
                                <option value="مرتين">مرتين</option>
                                <option value="3 مرات" selected>3 مرات</option>
                                <option value="4 مرات">4 مرات</option>
                                <option value="6 مرات">6 مرات</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">المدة (رقم)</label>
                                <input type="number" id="input-dur-val" placeholder="مثال: 5" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-50 font-bold focus:ring-2 focus:ring-emerald-500 outline-none text-center">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">الوحدة</label>
                                <select id="input-dur-unit" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-50 font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <option value="أيام">أيام</option>
                                    <option value="أسابيع">أسابيع</option>
                                    <option value="شهر">شهر</option>
                                </select>
                            </div>
                        </div>

                        <button onclick="addDosage()" class="w-full bg-emerald-600 text-white font-black text-lg py-3 rounded-xl hover:bg-emerald-700 transition shadow-md mt-4 flex justify-center items-center gap-2">
                            <span>إضافة للملصقات</span> <span>+</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- قائمة الملصقات -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 min-h-[500px] flex flex-col">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center rounded-t-2xl">
                        <div>
                            <h2 class="font-bold text-gray-800">قائمة الملصقات</h2>
                            <p class="text-xs text-emerald-600 mt-1 font-bold">✓ تم ضبط التوسيط وهوامش الأمان للطباعة بشكل احترافي.</p>
                        </div>
                        <span id="label-count" class="bg-emerald-100 text-emerald-800 text-sm font-black px-3 py-1 rounded-full">0</span>
                    </div>
                    
                    <div id="labels-list" class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- البطاقات هنا -->
                    </div>

                    <div id="empty-state" class="flex-grow flex flex-col items-center justify-center text-gray-400 p-10">
                        <span class="text-5xl mb-3 opacity-50">🖨️</span>
                        <p class="font-bold text-lg">لا توجد جرعات للطباعة</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- منطقة الطباعة المخفية -->
    <div id="print-area" class="hidden"></div>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnd79VgkCFO_ySrtknuYFNbRO9ADDCScI",
            authDomain: "leabl-705b3.firebaseapp.com",
            databaseURL: "https://leabl-705b3-default-rtdb.firebaseio.com",
            projectId: "leabl-705b3",
            storageBucket: "leabl-705b3.firebasestorage.app",
            messagingSenderId: "1063041699640",
            appId: "1:1063041699640:web:7182a59163beee03b57bcd"
        };

        window.dosagesArray = [];
        window.branches = JSON.parse(localStorage.getItem('pharmacy_branches')) || [{ id: '1', name: "صيدلية", logo: "" }];
        window.activeBranchId = localStorage.getItem('pharmacy_active_branch') || '1';
        
        let db;
        const dbPath = 'pharmacy_settings/branches_data';

        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            const settingsRef = ref(db, dbPath);

            onValue(settingsRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    window.branches = data.branches || [];
                    window.activeBranchId = data.activeBranchId || null;
                    
                    localStorage.setItem('pharmacy_branches', JSON.stringify(window.branches));
                    localStorage.setItem('pharmacy_active_branch', window.activeBranchId);
                    
                    document.getElementById('cloud-status').innerHTML = "متصل بقاعدة البيانات 🟢";
                    document.getElementById('cloud-status').classList.replace('text-emerald-100', 'text-green-300');
                } else {
                    saveDataToDB(); 
                }
                updateUIWithActiveBranch();
                renderBranchesList();
                window.renderLabels();
            }, (error) => {
                useLocalFallback();
            });
        } catch (e) {
            useLocalFallback();
        }

        function useLocalFallback() {
            document.getElementById('cloud-status').innerHTML = "يعمل بالذاكرة المحلية 🟠";
            updateUIWithActiveBranch();
            renderBranchesList();
            window.renderLabels();
        }

        function saveDataToDB() {
            localStorage.setItem('pharmacy_branches', JSON.stringify(window.branches));
            localStorage.setItem('pharmacy_active_branch', window.activeBranchId);
            if (db) {
                set(ref(db, dbPath), {
                    branches: window.branches,
                    activeBranchId: window.activeBranchId
                }).catch(e => console.error("Firebase Error:", e));
            }
        }

        function updateUIWithActiveBranch() {
            const active = window.branches.find(b => b.id === window.activeBranchId);
            const badge = document.getElementById('active-branch-badge');
            const headerLogo = document.getElementById('header-logo-container');
            
            if (active) {
                badge.innerText = `فرع: ${active.name}`;
                badge.classList.replace('bg-white/20', 'bg-emerald-800');
                if(active.logo) {
                    headerLogo.innerHTML = `<img src="${active.logo}" class="w-full h-full object-contain" onerror="this.src=''; this.alt='💊'">`;
                } else {
                    headerLogo.innerHTML = `<span class="text-2xl font-bold text-emerald-600">${active.name.charAt(0)}</span>`;
                }
            }
        }

        function renderBranchesList() {
            const list = document.getElementById('branches-list');
            if(window.branches.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-500 py-3 text-sm">لا توجد فروع مضافة.</div>`;
                return;
            }

            list.innerHTML = window.branches.map(branch => {
                const isActive = branch.id === window.activeBranchId;
                return `
                <div class="flex items-center justify-between p-3 border rounded-xl ${isActive ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200 bg-white'}">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="branch-select" ${isActive ? 'checked' : ''} onchange="setActiveBranch('${branch.id}')" class="w-4 h-4 text-emerald-600 cursor-pointer">
                        <div class="w-8 h-8 rounded bg-white border flex items-center justify-center overflow-hidden shrink-0">
                            ${branch.logo ? `<img src="${branch.logo}" class="w-full h-full object-contain">` : `<span class="text-xs text-gray-400">بدون</span>`}
                        </div>
                        <span class="font-bold text-gray-800 text-sm">${branch.name}</span>
                    </div>
                    <button onclick="deleteBranch('${branch.id}')" class="text-red-400 hover:text-red-600 p-1">🗑️</button>
                </div>
                `;
            }).join('');
        }

        window.addNewBranch = function() {
            const name = document.getElementById('new-branch-name').value.trim();
            const logo = document.getElementById('new-branch-logo').value.trim();
            if(!name) { window.showToast("أدخل اسم الفرع", true); return; }

            const newBranch = { id: Date.now().toString(), name, logo };
            window.branches.push(newBranch);
            window.activeBranchId = newBranch.id;

            document.getElementById('new-branch-name').value = '';
            document.getElementById('new-branch-logo').value = '';
            
            saveDataToDB();
            updateUIWithActiveBranch();
            renderBranchesList();
            window.renderLabels();
            window.showToast("تم الحفظ بنجاح");
        };

        window.setActiveBranch = function(id) {
            window.activeBranchId = id;
            saveDataToDB();
            updateUIWithActiveBranch();
            window.renderLabels();
            window.showToast("تم تفعيل الفرع");
        };

        window.deleteBranch = function(id) {
            if(confirm("حذف هذا الفرع؟")) {
                window.branches = window.branches.filter(b => b.id !== id);
                if(window.activeBranchId === id) window.activeBranchId = window.branches.length ? window.branches[0].id : null;
                saveDataToDB();
                renderBranchesList();
                updateUIWithActiveBranch();
                window.renderLabels();
            }
        };

        window.openSettings = () => document.getElementById('settings-modal').classList.remove('modal-hidden');
        window.closeSettings = () => document.getElementById('settings-modal').classList.add('modal-hidden');
        
        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            document.getElementById('toast-icon').innerText = isError ? '❌' : '✅';
            toast.classList.replace(isError ? 'bg-gray-800' : 'bg-emerald-600', isError ? 'bg-red-600' : 'bg-gray-800');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        };

        // دالة تحويل الأرقام الإنجليزية إلى عربية
        function convertToArabicNumerals(text) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return text.toString().replace(/[0-9]/g, function(w) {
                return arabicNumbers[w];
            });
        }

        window.addDosage = function() {
            const qty = document.getElementById('input-qty').value;
            const type = document.getElementById('input-type').value;
            const freq = document.getElementById('input-freq').value;
            const durVal = document.getElementById('input-dur-val').value;
            const durUnit = document.getElementById('input-dur-unit').value;

            if (!durVal) { window.showToast("أدخل المدة أولاً", true); return; }

            const line1 = convertToArabicNumerals(`${qty} ${type} ${freq}`); 
            const line2 = convertToArabicNumerals(`لمدة ${durVal} ${durUnit}`); 

            window.dosagesArray.push({ id: Date.now(), line1, line2 });
            document.getElementById('input-dur-val').value = '';
            window.renderLabels();
        };

        window.removeDosage = function(id) {
            window.dosagesArray = window.dosagesArray.filter(d => d.id !== id);
            window.renderLabels();
        };

        window.renderLabels = function() {
            const list = document.getElementById('labels-list');
            const printArea = document.getElementById('print-area');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('label-count').innerText = window.dosagesArray.length;
            
            list.innerHTML = ''; printArea.innerHTML = '';

            if (window.dosagesArray.length === 0) {
                emptyState.classList.remove('hidden');
                return; 
            } 
            emptyState.classList.add('hidden');

            const activeBranch = window.branches.find(b => b.id === window.activeBranchId) || {name: "بدون", logo: ""};

            // 1. رسم المعاينة
            window.dosagesArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white border-2 border-emerald-200 rounded-lg shadow-sm relative group overflow-hidden h-16 flex";
                card.innerHTML = `
                    <button onclick="removeDosage(${item.id})" class="absolute top-1 left-1 bg-red-100 text-red-500 rounded-full w-6 h-6 flex items-center justify-center font-bold z-10 opacity-0 group-hover:opacity-100 transition">✕</button>
                    <div class="w-[25%] border-l border-gray-300 flex flex-col items-center justify-center p-1 bg-gray-50">
                        ${activeBranch.logo ? `<img src="${activeBranch.logo}" class="max-h-6 object-contain mb-1">` : ''}
                        <span class="text-[8px] font-black leading-none text-center">${activeBranch.name}</span>
                    </div>
                    <div class="w-[75%] flex flex-col items-center justify-center p-1 bg-white">
                        <span class="text-sm font-black text-black leading-tight">${item.line1}</span>
                        <span class="text-sm font-black text-black leading-tight mt-0.5">${item.line2}</span>
                    </div>
                `;
                list.appendChild(card);
            });

            // 2. كود الطباعة (تم ضبط التوسيط وهوامش الأمان فيه)
            const combinedSideHtml = `
                ${activeBranch.logo ? `<img src="${activeBranch.logo}" class="print-logo-img">` : ''}
                <div class="branch-text">${activeBranch.name}</div>
            `;

            for (let i = 0; i < window.dosagesArray.length; i += 2) {
                const dose1 = window.dosagesArray[i];
                const dose2 = window.dosagesArray[i + 1]; 

                const printPage = document.createElement('div');
                printPage.className = "label-page";

                const buildSticker = (item) => `
                    <div class="single-sticker">
                        <div class="logo-section">
                            ${combinedSideHtml}
                        </div>
                        <div class="dosage-section">
                            <div class="dose-line">${item.line1}</div>
                            <div class="dose-line">${item.line2}</div>
                        </div>
                    </div>
                `;

                let pageHtml = buildSticker(dose1);

                if (dose2) {
                    pageHtml += buildSticker(dose2); 
                } else {
                    pageHtml += `<div class="single-sticker"></div>`; 
                }

                printPage.innerHTML = pageHtml;
                printArea.appendChild(printPage);
            }
        }
    </script>
</body>
</html>
